version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - "SA_PASSWORD=${SA_PASSWORD:-CorvusAdmin@2026!}"
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - "ConnectionStrings__SqlServerConnection=Server=db;Database=CorvusIAMDb;User=sa;Password=${SA_PASSWORD:-CorvusAdmin@2026!};TrustServerCertificate=True;"
      - DatabaseProvider=SqlServer
      - "Jwt__Key=${JWT_KEY:-CorvuxIAM_SegurancaCorporativa_JWT_Secret_Key_2026_Producao!}"
      - "Turnstile__SiteKey=${TURNSTILE_SITEKEY:-0x4AAAAAAFXK5J9F5V8zblrT}"
      - "Turnstile__SecretKey=${TURNSTILE_SECRETKEY:-0x4AAAAAAFXK5H5jTPKYIrdR2p0kwwYhL1Y}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sql_data:
