<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorvusIAM — Modo Offline</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090A0C;
            --bg-card: #121418;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --accent-blue: #2563EB;
            --border-color: #22272E;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .offline-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 10px;
            font-weight: 700;
        }
        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .btn-retry {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
        }
        .badge-sync {
            display: inline-block;
            margin-top: 16px;
            font-size: 12px;
            color: #10B981;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="/icons/corvus-logo.png?v=20261015" alt="CorvuxIAM" style="width: 72px; height: 72px; border-radius: 16px; margin: 0 auto 16px; display: block; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);">
        <h1>Sem Conexão com a Internet</h1>
        <p>Você está atualmente desconectado da rede. No aplicativo mobile CorvuxIAM, suas solicitações são armazenadas no banco local IndexedDB e transmitidas automaticamente assim que o sinal for restabelecido.</p>
        <button class="btn-retry" onclick="window.location.reload()">Tentar Reconectar Agora</button>
        <div class="badge-sync">✓ Sincronização Automática Ativa</div>
    </div>
</body>
</html>
