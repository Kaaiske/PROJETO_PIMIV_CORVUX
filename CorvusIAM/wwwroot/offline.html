<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorvuxIAM — Modo Offline</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=20261017">
    <link rel="shortcut icon" href="/favicon.ico?v=20261017" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --accent-blue: #2563EB;
            --border-color: #E2E8F0;
        }
        html.dark {
            --bg-body: #0B0E14;
            --bg-card: #111621;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-blue: #3B82F6;
            --border-color: #1E2636;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .offline-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 36px 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
        }
        h1 {
            font-size: 18px;
            margin: 0 0 8px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .btn-retry {
            background: var(--accent-blue);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            padding: 11px 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .btn-retry:hover {
            opacity: 0.92;
        }
        .badge-sync {
            display: inline-block;
            margin-top: 16px;
            font-size: 11px;
            color: #10B981;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 4px 12px;
            border-radius: 999px;
        }
        .logo-dark { display: none; }
        .logo-light { display: block; }
        html.dark .logo-dark { display: block; }
        html.dark .logo-light { display: none; }
    </style>
    <script>
        if (localStorage.getItem('corvux-theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body>
    <div class="offline-card">
        <img src="/icons/corvus-logo-light.png?v=20261017" alt="CorvuxIAM" class="logo-light" style="width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 16px; border: 1px solid #E2E8F0;">
        <img src="/icons/corvus-logo-dark.png?v=20261017" alt="CorvuxIAM" class="logo-dark" style="width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 16px; border: 1px solid #1E2636;">
        <h1>Sem Conexão com a Internet</h1>
        <p>Você está desconectado da rede. No aplicativo mobile CorvuxIAM, suas solicitações são salvas localmente (IndexedDB) e sincronizadas assim que a conexão retornar.</p>
        <button class="btn-retry" onclick="window.location.reload()">Tentar Reconectar Agora</button>
        <div class="badge-sync">✓ Sincronização Automática Ativa</div>
    </div>
</body>
</html>
