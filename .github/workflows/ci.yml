name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore CorvusIAM.sln

    - name: Build Solution (Release)
      run: dotnet build CorvusIAM.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test CorvusIAM.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Build Docker Container
      run: docker build -t corvusiam:latest CorvusIAM/
