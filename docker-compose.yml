services:
  corvusiam.web:
    image: corvusiamweb
    build:
      context: ./CorvusIAM
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_URLS=http://+:8080
      - "ConnectionStrings__SqlServerConnection=Server=sqlserver;Database=CorvusIAMDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Variavel de ambiente SQL_SA_PASSWORD obrigatoria};TrustServerCertificate=True;"
      - DatabaseProvider=SqlServer
      - "Jwt__Key=${JWT_KEY:?Variavel de ambiente JWT_KEY obrigatoria}"
      - Jwt__Issuer=CorvusIAM
      - Jwt__Audience=CorvusIAMUsers
      - "App__Domain=${APP_DOMAIN:-https://corvuxiam.tech}"
      - "Turnstile__SiteKey=${TURNSTILE_SITEKEY:-}"
      - "Turnstile__SecretKey=${TURNSTILE_SECRETKEY:-}"
      - "Smtp__Host=${SMTP_HOST:-smtp.gmail.com}"
      - "Smtp__Port=${SMTP_PORT:-587}"
      - "Smtp__Email=${SMTP_EMAIL:-seguranca@corvuxiam.tech}"
      - "Smtp__Password=${SMTP_PASSWORD:-}"
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - corvus-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    environment:
      - ACCEPT_EULA=Y
      - "SA_PASSWORD=${SQL_SA_PASSWORD:?Variavel de ambiente SQL_SA_PASSWORD obrigatoria}"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
      - ./backups:/var/opt/mssql/backup
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - corvus-network

networks:
  corvus-network:
    driver: bridge

volumes:
  sqlserver_data:
