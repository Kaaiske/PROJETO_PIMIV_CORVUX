services:
  corvusiam.web:
    image: corvusiamweb
    build:
      context: ./CorvusIAM
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_URLS=http://+:8080
      - "ConnectionStrings__SqlServerConnection=Server=sqlserver;Database=CorvusIAMDb;User Id=sa;Password=${SQL_SA_PASSWORD:-CorvusAdmin@2026!};TrustServerCertificate=True;"
      - DatabaseProvider=SqlServer
      - "Jwt__Key=${JWT_KEY:-CorvuxIAM_SegurancaCorporativa_JWT_Secret_Key_2026_Producao!}"
      - Jwt__Issuer=CorvusIAM
      - Jwt__Audience=CorvusIAMUsers
      - "Turnstile__SiteKey=${TURNSTILE_SITEKEY:-3x00000000000000000000FF}"
      - "Turnstile__SecretKey=${TURNSTILE_SECRETKEY:-2x0000000000000000000000000000000AA}"
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - corvus-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    ports:
      # Blindagem de Rede: Porta restrita exclusivamente ao loopback local (127.0.0.1)
      # Bloqueia qualquer tentativa de escaneamento externo ou forca bruta via Internet
      - "127.0.0.1:1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - "SA_PASSWORD=${SQL_SA_PASSWORD:-CorvusAdmin@2026!}"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
      - ./backups:/var/opt/mssql/backup
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - corvus-network

networks:
  corvus-network:
    driver: bridge

volumes:
  sqlserver_data:
