services:
  corvusiam.web:
    image: corvusiamweb
    build:
      context: ./CorvusIAM
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__SqlServerConnection=Server=sqlserver;Database=CorvusIAMDb;User Id=sa;Password=${SQL_SA_PASSWORD:-CorvuxAdmin@2026!};TrustServerCertificate=True;
      - DatabaseProvider=SqlServer
      - Jwt__Key=${JWT_KEY:-CorvuxIAM_SegurancaCorporativa_JWT_Secret_Key_2026_Producao!}
      - Jwt__Issuer=CorvusIAM
      - Jwt__Audience=CorvusIAMUsers
    restart: unless-stopped
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SA_PASSWORD:-CorvuxAdmin@2026!}
    volumes:
      - sqlserver_data:/var/opt/mssql/data
      - ./backups:/var/opt/mssql/backup
    restart: unless-stopped

volumes:
  sqlserver_data:
